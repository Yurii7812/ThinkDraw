<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BRESUTO 共有ボード</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; background: var(--canvas, #f4f4f2); }
      .web-head { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
      .web-pane { flex: 1; display: flex; min-height: 0; }
      .web-pane > .canvas { flex: 1; }
      .web-msg { font-family: sans-serif; padding: 2em; color: var(--muted); }
      .web-colors { display: flex; gap: 8px; margin: 10px 0 14px; }
      .web-color { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
      .web-color.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--panel) inset; }
    </style>
  </head>
  <body>
    <script src="web.js"></script>
  </body>
</html>
